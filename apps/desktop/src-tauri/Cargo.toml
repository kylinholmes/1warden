[package]
name = "coffer"
version = "0.0.0"
description = "Coffer —— 个人密码管理器"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 生产构建时关掉 devtools —— 密码管理器不该在发布版里留调试入口
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 体积优化：密码管理器的安装包不该有几十 MB
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
