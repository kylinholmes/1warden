[package]
name = "coffer"
version = "0.0.0"
description = "Coffer —— 个人密码管理器"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 的约定：lib 名必须是 `<package>_lib`，否则 main.rs 里的
# `coffer_lib::run()` 会找不到 crate。
# staticlib/cdylib 是给移动端（iOS/Android）用的 —— 桌面端用 rlib。
name = "coffer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 二进制体经 IPC 传输要编码 —— Tauri 的 IPC 是 JSON。
# 附件上传走这条：直接传字节会被 UTF-8 解码静默改掉
base64 = "0.22"

# 系统保存对话框 —— 附件的「取回」要用。
# 直接引 crate 而不是 Tauri 的 dialog 插件：插件要额外的权限声明与
# 打包配置，而我们需要的只是「问用户存哪」这一件事。
rfd = "0.15"

# ── 网络 ──
# 网络请求必须在 Rust 侧发出：WebView 的 origin 是 tauri://localhost，
# 跨源请求会被 CORS 拦掉（Vaultwarden 只对配置的 DOMAIN 回 ACAO）。
# 详见 src/http.rs 顶部的说明。
#
# `-no-provider`：让 reqwest 不要自己挑加密后端，由我们显式装 ring。
# 这样能避开 aws-lc-rs —— 它在部分机器上需要 cmake 才能编。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-manual-roots-no-provider",
    "charset",
    "http2",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
# 用系统信任库：用户把自签证书装进钥匙串后，应用就该直接认
rustls-native-certs = "0.8"
sha2 = "0.10"
# 解析证书的签发者/有效期 —— 只给指纹的话，普通用户没法判断该不该信任
x509-parser = "0.16"

# ── 原生自动输入（spec §7.4）──
# 只做「往当前焦点合成按键」，不读任何应用的界面内容。
# 详见 src/autotype.rs 顶部的说明。
[target.'cfg(target_os = "macos")'.dependencies]
# 合成按键。注意 CGEventKeyboardSetUnicodeString 在 20 个 UTF-16 码元处截断
core-graphics = "0.25"
# AXIsProcessTrusted —— 判断辅助功能授权状态
accessibility-sys = "0.2"

# ── Touch ID 解锁（spec 不变量 S1 的**显式例外**，见 src/biometric.rs）──
#
# ⚠️ 这里用的是 **-sys**（裸 FFI），不是 `security-framework` 的高层 API。
# 高层那个 `ItemAddOptions` **没有** `kSecAttrAccessControl` 字段，
# 而「只有指纹能取出这条」全靠那个属性 —— 用高层 API 写出来的是
# 一个**任何进程都能读**的普通钥匙串条目，功能看着能用，安全性是零。
security-framework-sys = "2"
# 拼钥匙串查询用的 CFDictionary。
#
# ⚠️ 用 **-sys** 而不是 `core-foundation` 的高层包装：0.10 那版的包装
# **不实现 `Drop`**，用它等于每次调用都漏一个 CF 对象 ——
# 而钥匙串调用不频繁，漏了也看不出来，只会在长期运行里慢慢涨。
# 裸 FFI 啰嗦，但每个引用的归属是写明白的。
core-foundation-sys = "0.8"

[features]
# 生产构建时关掉 devtools —— 密码管理器不该在发布版里留调试入口
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 体积优化：密码管理器的安装包不该有几十 MB
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
