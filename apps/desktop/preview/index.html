<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      ⚠️ 这个 viewport 必须和产品那份（`apps/desktop/index.html`）**一模一样**。

      它一度完全不写 viewport。在桌面浏览器上这没有任何影响（viewport meta
      本来就被忽略），所以看起来「预览好好的」—— 但只要打开触摸/移动模拟，
      **布局视口就变成 980px 的默认值**：截图出来是一个 980px 宽的桌面布局，
      而它会被当成「390px 下的手机界面」看。

      实测过：`ONEWARDEN_SHOT_TOUCH=1` + 390×844 截出来的是 1960×4242 的
      桌面三栏布局，左边 rail 还是展开的（因为 980 > 900 的容器查询断点）。

      这是**仪器骗人**那一族里最坏的一种：它不报错、不空白，它给你一张
      看起来很正常的图，只是那张图不是你以为的那个东西。
      `src/safe-area.test.ts` 现在把这两份 HTML 的 viewport 钉在一起。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>1Warden 界面预览</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
