name: 1Warden builds

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '26.8.1'
  RUST_VERSION: '1.98.1'
  CI: 'true'

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - name: Verify package and tag versions
        id: version
        run: |
          bun run scripts/build-version.ts
      - run: bun run check

  ui:
    name: Automated ${{ matrix.suite }} smoke
    needs: check
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, extensions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build and test isolated synthetic clients
        env:
          ONEWARDEN_CI_OUTPUT: ${{ runner.temp }}/1warden-ci-${{ matrix.suite }}
        run: bun run test:ui -- ${{ matrix.suite }}
      - name: Upload smoke evidence even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ matrix.suite }}-windows
          path: ${{ runner.temp }}/1warden-ci-${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 14

  vaultwarden:
    name: Real Vaultwarden 1.37.4 protocol smoke
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      vaultwarden:
        image: vaultwarden/server:1.37.4
        env:
          DOMAIN: http://127.0.0.1:18083
          SIGNUPS_ALLOWED: 'true'
          SIGNUPS_VERIFY: 'false'
          WEB_VAULT_ENABLED: 'false'
          PUSH_ENABLED: 'false'
          DISABLE_ICON_DOWNLOAD: 'true'
          LOG_LEVEL: warn
        ports:
          - 127.0.0.1:18083:80
        options: >-
          --health-cmd /healthcheck.sh
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Register, log in, save, update and sync through fresh clients
        env:
          VW_TEST_URL: http://127.0.0.1:18083
          ONEWARDEN_CI_OUTPUT: ${{ runner.temp }}/1warden-ci-vaultwarden
        run: bun run test:vaultwarden
      - name: Upload credential-free protocol evidence even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-vaultwarden
          path: ${{ runner.temp }}/1warden-ci-vaultwarden/vaultwarden-report.json
          if-no-files-found: warn
          retention-days: 14

  extensions:
    name: Chromium and Firefox packages
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:extension-firefox
      - name: Archive extensions
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/artifacts/browser"
          mkdir -p "$package_dir"
          (cd apps/desktop/dist-extension && zip -q -r "$package_dir/1Warden-$APP_VERSION-chromium.zip" .)
          (cd apps/desktop/dist-firefox && zip -q -r "$package_dir/1Warden-$APP_VERSION-firefox.zip" .)
          unzip -t "$package_dir/1Warden-$APP_VERSION-chromium.zip"
          unzip -t "$package_dir/1Warden-$APP_VERSION-firefox.zip"
          (cd "$package_dir" && sha256sum ./*.zip > SHA256SUMS-browser.txt)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 1Warden-browser-extensions
          path: artifacts/browser/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    name: Apple Silicon macOS package
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.check.outputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      APPLE_SIGNING_IDENTITY: '-'
      RELEASE_BUILD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust and ARM target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-darwin
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-arm64-rust-${{ env.RUST_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-arm64-rust-${{ env.RUST_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Build frontend for Rust test context
        run: bun run --cwd apps/desktop build
      - name: Native unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Build Apple Silicon app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle"
          if [ "$RELEASE_BUILD" = true ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY"
            config_path="$RUNNER_TEMP/tauri-release.json"
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":true}}' > "$config_path"
            bun run build:desktop -- --ci --target aarch64-apple-darwin --bundles app,dmg --config "$config_path" -- --locked
          else
            config_path="$RUNNER_TEMP/tauri-ci.json"
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > "$config_path"
            bun run build:desktop -- --ci --target aarch64-apple-darwin --bundles app,dmg --config "$config_path" -- --locked
          fi
      - name: Verify and archive macOS packages
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle"
          app_path="$bundle_dir/macos/1Warden.app"
          package_dir="$GITHUB_WORKSPACE/artifacts/macos"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          test "$(lipo -archs "$app_path/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict "$app_path"
          mkdir -p "$package_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$package_dir/1Warden-$APP_VERSION-macos-apple-silicon.app.zip"
          shopt -s nullglob
          dmg_files=("$bundle_dir/dmg/"*.dmg)
          test "${#dmg_files[@]}" -eq 1
          cp "${dmg_files[0]}" "$package_dir/1Warden-$APP_VERSION-macos-apple-silicon.dmg"
          if [ "$RELEASE_BUILD" = true ]; then
            update_name="1Warden-$APP_VERSION-macos-apple-silicon.app.tar.gz"
            cp "$bundle_dir/macos/1Warden.app.tar.gz" "$package_dir/$update_name"
            cp "$bundle_dir/macos/1Warden.app.tar.gz.sig" "$package_dir/$update_name.sig"
          fi
          (cd "$package_dir" && files=(*.zip *.dmg *.tar.gz *.sig) && shasum -a 256 "${files[@]}" > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 1Warden-macos-apple-silicon
          path: artifacts/macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows:
    name: Windows x64 packages and WebView2 smoke
    needs: check
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.check.outputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      ONEWARDEN_NATIVE_EXE: ${{ github.workspace }}/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/1warden.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add x86_64-pc-windows-msvc
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-x64-rust-${{ env.RUST_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-x64-rust-${{ env.RUST_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - run: bun run build:windows -- --ci -- --locked
      - name: Verify Evergreen WebView2 runtime
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $versions = @($runtimeKeys | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' })
          if ($versions.Count -eq 0) { throw 'The runner has no Evergreen WebView2 runtime; install it before running native smoke tests.' }
          Write-Output "WebView2 runtime: $($versions -join ', ')"
      - name: Isolated native WebView2 regression (no real clipboard)
        env:
          ONEWARDEN_CI_OUTPUT: ${{ runner.temp }}/1warden-ci-native
          # Diagnostic probe: measure cold readiness beyond the normal 10s budget.
          ONEWARDEN_NATIVE_STARTUP_PROBE: '1'
        run: bun run test:windows
      - name: Upload native evidence even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-native-windows
          path: ${{ runner.temp }}/1warden-ci-native/
          if-no-files-found: warn
          retention-days: 14
      - name: Package Windows installer and portable executable
        run: |
          $installers = @(Get-ChildItem -LiteralPath "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $installerName = "1Warden-$env:APP_VERSION-windows-x64-setup.exe"
          $portableName = "1Warden-$env:APP_VERSION-windows-x64-portable.exe"
          if (-not (Test-Path -LiteralPath $env:ONEWARDEN_NATIVE_EXE -PathType Leaf)) { throw 'Missing built portable executable' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "$packageDir/$installerName"
          Copy-Item -LiteralPath $env:ONEWARDEN_NATIVE_EXE -Destination "$packageDir/$portableName"
          @($installerName, $portableName) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $packageDir $_)).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -Encoding utf8NoBOM -LiteralPath "$packageDir/SHA256SUMS-windows.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: 1Warden-windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged packages
    needs: [check, ui, vaultwarden, extensions, macos, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: 1Warden-*
          merge-multiple: true
          path: release-artifacts
      - name: Create signed update manifest
        run: bun run scripts/updater-manifest.ts release-artifacts
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum ./*.zip ./*.dmg ./*.exe ./*.tar.gz ./*.sig latest.json > SHA256SUMS.txt
          assets=(./*.zip ./*.dmg ./*.exe ./*.tar.gz ./*.sig SHA256SUMS.txt)
          printf '%s\n' \
            'Includes Chromium and Firefox extensions, Apple Silicon macOS app/DMG, and Windows x64 installer/portable executables.' \
            'These are testing packages: the macOS app is ad-hoc signed, without Developer ID signing or notarization; browser extensions require manual installation.' \
            'macOS prepares signed updates and prompts for an explicit restart. Windows updates use the downloaded installer; Windows packages are not Authenticode signed.' \
            "Installation and build instructions: https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs/builds.md" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release upload "$RELEASE_TAG" latest.json --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" latest.json \
              --draft --verify-tag --title "1Warden $RELEASE_TAG" --generate-notes --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false
